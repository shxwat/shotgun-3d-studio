<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>12-Gauge Pump Shotgun — 3D Studio</title>
    <style>
      :root {
        --bg-color: #0b0c10;
        --panel-bg: rgba(18, 20, 26, 0.92);
        --panel-border: rgba(255, 255, 255, 0.12);
        --accent-blue: #38bdf8;
        --accent-teal: #00f5d4;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100vw; height: 100vh;
        background: var(--bg-color);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-primary);
        overflow: hidden;
        user-select: none;
        touch-action: none;
      }
      #stage { width: 100vw; height: 100vh; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }

      /* Minimal HUD */
      #hud {
        position: fixed; left: 16px; top: 16px;
        font: 11px/1.4 monospace; color: var(--text-secondary);
        z-index: 10; pointer-events: none; opacity: 0.85;
      }
      .hud-title { font-weight: 700; color: var(--accent-blue); font-size: 13px; margin-bottom: 2px; }

      /* Floating Control Panel */
      #control-panel {
        position: fixed; right: 16px; top: 16px;
        width: 220px;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 12px;
        z-index: 20;
        display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(56, 189, 248, 0.15);
      }

      .panel-header {
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 8px;
      }
      .panel-title { font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2; letter-spacing: 0.5px; }
      .panel-subtitle { font-size: 10px; color: var(--accent-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }

      .section-group { display: flex; flex-direction: column; gap: 5px; }
      .section-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.6px; }

      .svg-icon {
        width: 13px; height: 13px; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        display: inline-block; vertical-align: middle;
      }

      .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
      .btn-full { width: 100%; }
      .btn {
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 10.5px; font-weight: 600;
        cursor: pointer; transition: all 0.15s ease;
        display: flex; align-items: center; justify-content: center; gap: 4px;
        text-align: center;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
      .btn:active { transform: scale(0.97); }

      .btn-explode {
        background: rgba(56, 189, 248, 0.15);
        border-color: var(--accent-blue);
        color: #7dd3fc;
        font-weight: 700;
      }
      .btn-explode.active {
        background: rgba(239, 68, 68, 0.25);
        border-color: #ef4444;
        color: #fca5a5;
      }

      .btn-action {
        background: rgba(0, 245, 212, 0.12);
        border-color: var(--accent-teal);
        color: #99f6e4;
      }

      .btn-preset.active {
        background: rgba(56, 189, 248, 0.25);
        border-color: var(--accent-blue);
        color: #7dd3fc;
      }

      .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--text-primary); }
      .toggle-row input[type=checkbox] { cursor: pointer; width: 13px; height: 13px; accent-color: var(--accent-blue); margin: 0; }

      .key-info {
        font-size: 9px; color: var(--text-secondary);
        border-top: 1px solid var(--panel-border); padding-top: 8px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
      }
      .key-tag { background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; font-family: monospace; color: var(--text-primary); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <div class="hud-title">PUMP SHOTGUN 12G</div>
      <div>FPS: <span id="fps-val">60</span></div>
      <div>Mode: <span id="mode-val">Hero Studio</span></div>
      <div style="font-size: 9px; color: #38bdf8; margin-top: 4px;">Drag to Orbit • Scroll to Zoom • Right-Drag to Pan</div>
    </div>

    <div id="control-panel">
      <div class="panel-header">
        <div class="panel-title">Pump Shotgun</div>
        <div class="panel-subtitle">3D Interactive Studio</div>
      </div>

      <!-- 3D Disassembly Button -->
      <div class="section-group">
        <button id="btn-explode-toggle" class="btn btn-explode btn-full">
          <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          Disassemble
        </button>
      </div>

      <!-- Action & Firing Controls -->
      <div class="section-group">
        <div class="section-label">Actions</div>
        <div class="btn-grid">
          <button id="btn-fire" class="btn btn-action">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line></svg>
            Fire
          </button>
          <button id="btn-pump" class="btn btn-action">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
            Rack Pump
          </button>
        </div>
        <button id="btn-reload" class="btn btn-full">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          Reload Shell
        </button>
      </div>

      <!-- 3D Print Finishes -->
      <div class="section-group">
        <div class="section-label">3D Print Skins & Graphics</div>
        <div class="btn-grid">
          <button id="preset-cyberprint" class="btn btn-preset active">3D Cyber Print</button>
          <button id="preset-printedsteel" class="btn btn-preset">3D Steel Print</button>
          <button id="preset-wood" class="btn btn-preset">3D Wood Print</button>
          <button id="preset-stealth" class="btn btn-preset">3D Stealth Print</button>
        </div>
      </div>

      <!-- Camera Angles -->
      <div class="section-group">
        <div class="section-label">Camera Angle</div>
        <div class="btn-grid">
          <button id="cam-hero" class="btn">Hero</button>
          <button id="cam-side" class="btn">Side</button>
          <button id="cam-muzzle" class="btn">Muzzle</button>
          <button id="cam-pump" class="btn">Pump</button>
        </div>
      </div>

      <!-- Settings Toggles -->
      <div class="section-group">
        <div class="section-label">Settings</div>
        <div class="toggle-row">
          <span>Slow-Mo (0.1x)</span>
          <input id="toggle-slowmo" type="checkbox" />
        </div>
        <div class="toggle-row">
          <span>Auto-Orbit</span>
          <input id="toggle-orbit" type="checkbox" />
        </div>
      </div>

      <!-- Key Shortcuts -->
      <div class="key-info">
        <div><span class="key-tag">E</span> Explode</div>
        <div><span class="key-tag">Space</span> Fire / Rack</div>
        <div><span class="key-tag">R</span> Reload</div>
        <div><span class="key-tag">1-4</span> Finishes</div>
      </div>
    </div>

    <script type="module" src="/viewer/main.ts"></script>
  </body>
</html>
